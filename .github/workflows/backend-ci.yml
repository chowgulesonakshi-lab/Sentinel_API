name: Backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run backend tests
        working-directory: backend
        run: bash ./gradlew test --no-daemon
      - name: Validate workflow YAML files
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |file| YAML.load_file(file); puts "Valid YAML: #{file}" }'
      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t sentinel-api-backend:ci .
