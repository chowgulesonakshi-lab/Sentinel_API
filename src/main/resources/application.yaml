server:
  port: ${PORT:8080}

spring:
  profiles:
    active: db

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel_api}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect