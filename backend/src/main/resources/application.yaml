server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

spring:
  profiles:
    active: db
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel_api}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}, traceId=%X{traceId:-}, spanId=%X{spanId:-}]"
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}

# Incident intelligence provider (Ollama by default; override through environment variables).
sentinel:
  notifications:
    webhook:
      enabled: ${ALERT_WEBHOOK_ENABLED:false}
      url: ${ALERT_WEBHOOK_URL:}
  ai:
    enabled: ${SENTINEL_AI_ENABLED:true}
    base-url: ${SENTINEL_AI_BASE_URL:http://localhost:11434}
    model: ${SENTINEL_AI_MODEL:qwen2.5:7b}
